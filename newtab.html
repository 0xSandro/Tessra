<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tessra</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div id="board"><!-- widgets rendered here --></div>

  <button id="edit-toggle" title="Toggle edit mode (E)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
    </svg>
    <span class="edit-label">Edit</span>
  </button>

  <aside id="side-panel" aria-hidden="true">
    <div class="panel-header">
      <span class="panel-brand">
        <svg class="panel-logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="3" y="3"  width="8" height="8"  rx="1.5" fill="currentColor"/>
          <rect x="13" y="3"  width="8" height="4"  rx="1.5" fill="currentColor"/>
          <rect x="13" y="9"  width="8" height="8"  rx="1.5" fill="currentColor"/>
          <rect x="3" y="13" width="8" height="8"  rx="1.5" fill="currentColor"/>
          <rect x="13" y="19" width="8" height="2"  rx="1"   fill="currentColor" opacity="0.5"/>
        </svg>
        Tessra
      </span>
      <button id="panel-close" title="Close">×</button>
    </div>
    <div class="panel-tabs" role="tablist">
      <button class="panel-tab active" data-tab="widgets" role="tab">Widgets</button>
      <button class="panel-tab" data-tab="theme" role="tab">Theme</button>
    </div>

    <div class="panel-pane" data-pane="widgets">
      <p class="panel-hint">Drag a widget onto the page.</p>
      <div class="widget-catalog" id="widget-catalog">
        <!-- Cards generated from the widget registry -->
      </div>
    </div>

    <div class="panel-pane hidden" data-pane="theme">
      <section class="control-group">
        <h3>Background</h3>
        <div class="seg-control" data-control="bgType">
          <button data-value="dots">Dotted</button>
          <button data-value="color">Color</button>
          <button data-value="image">Image</button>
        </div>
        <div class="row" data-show="bgType:color,dots">
          <span>Color</span>
          <div class="color-control" data-key="bgColor"></div>
          <button class="reset-btn" data-reset="bgColor" title="Reset to default" aria-label="Reset"></button>
        </div>
        <div class="upload-row" data-show="bgType:image">
          <button type="button" class="upload-btn" id="bgImageBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Choose image</span>
          </button>
          <button type="button" class="upload-btn" id="bgImageClear" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            <span>Clear</span>
          </button>
          <input type="file" id="bgImage" accept="image/*" hidden />
        </div>
        <div class="image-preview hidden" id="bgImagePreview" data-show="bgType:image">
          <img class="image-preview-thumb" id="bgImageThumb" alt=""/>
          <div class="image-preview-info">
            <div class="image-preview-name" id="bgImageName"></div>
            <div class="image-preview-res" id="bgImageRes"></div>
          </div>
        </div>
      </section>

      <section class="control-group">
        <h3>Widget</h3>
        <label class="row toggle-row">
          <span>Window-style headers</span>
          <input type="checkbox" id="showHeaders" class="toggle"/>
        </label>
        <div class="row">
          <span>Fill</span>
          <div class="color-control" data-key="widgetBg"></div>
          <button class="reset-btn" data-reset="widgetBg" title="Reset to default" aria-label="Reset"></button>
        </div>
        <div class="row">
          <span>Border</span>
          <div class="color-control" data-key="widgetBorder"></div>
          <button class="reset-btn" data-reset="widgetBorder" title="Reset to default" aria-label="Reset"></button>
        </div>
        <div class="slider-row">
          <span>Border width</span>
          <input type="range" min="0" max="4" step="1" id="widgetBorderWidth"/>
          <input type="number" min="0" max="4" step="1" id="widgetBorderWidthN" class="num"/>
          <span class="unit">px</span>
          <button class="reset-btn" data-reset="widgetBorderWidth" title="Reset to default" aria-label="Reset"></button>
        </div>
        <div class="slider-row">
          <span>Corner radius</span>
          <input type="range" min="0" max="24" step="1" id="widgetRadius"/>
          <input type="number" min="0" max="24" step="1" id="widgetRadiusN" class="num"/>
          <span class="unit">px</span>
          <button class="reset-btn" data-reset="widgetRadius" title="Reset to default" aria-label="Reset"></button>
        </div>
        <div class="slider-row">
          <span>Shadow</span>
          <input type="range" min="0" max="100" step="1" id="widgetShadow"/>
          <input type="number" min="0" max="100" step="1" id="widgetShadowN" class="num"/>
          <span class="unit">%</span>
          <button class="reset-btn" data-reset="widgetShadow" title="Reset to default" aria-label="Reset"></button>
        </div>
      </section>

      <section class="control-group">
        <button class="btn-subtle danger" id="themeReset">Reset everything to defaults</button>
      </section>
    </div>
  </aside>

  <!-- Per-widget settings popover (auto-generated from settingsSchema) -->
  <div id="settings-popover" class="hidden" role="dialog" aria-label="Widget settings">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="settings-reset" title="Reset to defaults" aria-label="Reset"></button>
    </div>
    <div class="settings-content"></div>
  </div>

  <!-- Custom color picker popover -->
  <div id="color-popover" class="hidden" role="dialog" aria-label="Color picker">
    <div class="cp-preview"></div>
    <label class="cp-slider-label">Hue
      <input type="range" min="0" max="360" step="1" class="cp-hue cp-slider"/>
    </label>
    <label class="cp-slider-label">Saturation
      <input type="range" min="0" max="100" step="1" class="cp-sat cp-slider"/>
    </label>
    <label class="cp-slider-label">Lightness
      <input type="range" min="0" max="100" step="1" class="cp-lig cp-slider"/>
    </label>
    <div class="cp-hex-row">
      <span class="cp-hex-prefix">#</span>
      <input type="text" class="cp-hex" maxlength="6" spellcheck="false"/>
    </div>
  </div>

  <!-- Drag preview ghost while dragging from panel -->
  <div id="drag-ghost" class="hidden"></div>

  <!-- Templates -->
  <template id="tpl-widget">
    <div class="widget" tabindex="0">
      <div class="widget-header">
        <span class="widget-title"></span>
        <div class="widget-actions">
          <button class="widget-settings" title="Settings">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </button>
          <button class="widget-remove" title="Remove">×</button>
        </div>
      </div>
      <div class="widget-body"></div>
      <div class="widget-resize" title="Resize" aria-hidden="true"></div>
    </div>
  </template>

  <script type="module" src="src/main.js"></script>
</body>
</html>
